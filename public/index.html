<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="topbar">
            <div class="brand">
                <div class="brand-icon">✓</div>
                <div>
                    <h1>TaskFlow</h1>
                    <p>Smart task management</p>
                </div>
            </div>

            <button class="add-btn" onclick="openModal()">
                <span>+</span> New Task
            </button>
        </header>

        <main>

            <section class="hero">
                <div>
                    <p class="eyebrow">YOUR WORKSPACE</p>
                    <h2>Stay focused.<br><span>Get things done.</span></h2>
                    <p class="hero-text">
                        Organize your work, track your progress,
                        and keep every task under control.
                    </p>
                </div>

                <div class="stats">
                    <div class="stat-card">
                        <span>Total</span>
                        <strong id="totalCount">0</strong>
                    </div>

                    <div class="stat-card">
                        <span>Pending</span>
                        <strong id="pendingCount">0</strong>
                    </div>

                    <div class="stat-card">
                        <span>Completed</span>
                        <strong id="completedCount">0</strong>
                    </div>
                </div>
            </section>

            <section class="tasks-section">

                <div class="section-heading">
                    <div>
                        <p class="eyebrow">TASKS</p>
                        <h3>Your tasks</h3>
                    </div>

                    <button class="refresh-btn" onclick="loadTasks()">
                        ↻ Refresh
                    </button>
                </div>

                <div id="taskList" class="task-list">
                    <div class="loading">Loading tasks...</div>
                </div>

            </section>

        </main>

    </div>

    <!-- Add/Edit Modal -->
    <div id="modal" class="modal hidden">

        <div class="modal-box">

            <div class="modal-header">
                <div>
                    <p class="eyebrow">TASK</p>
                    <h3 id="modalTitle">Create new task</h3>
                </div>

                <button class="close-btn" onclick="closeModal()">×</button>
            </div>

            <form id="taskForm">

                <input type="hidden" id="taskId">

                <label>Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Enter task title"
                    required
                >

                <label>Description</label>
                <textarea
                    id="description"
                    placeholder="What needs to be done?"
                ></textarea>

                <div class="form-row">

                    <div>
                        <label>Priority</label>
                        <select id="priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>

                    <div>
                        <label>Status</label>
                        <select id="status">
                            <option value="pending" selected>Pending</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>

                </div>

                <label>Due Date</label>
                <input type="date" id="dueDate">

                <button type="submit" class="submit-btn">
                    Save Task
                </button>

            </form>

        </div>

    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>

</body>
</html>
